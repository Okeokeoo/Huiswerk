const BASE=['Rekenen','Taal','Spelling','Ontleden','Tekstbegrip','Schaken'];
const STORE='huiswerk_v48_2026_v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(STORE))}catch{return null}};
let state=load()||{subjects:BASE.map((name,i)=>({id:'s'+i,name})),weeks:{},year:2026,week:48};
let tab='week',active=null,dialog=null;
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const weekKey=(y=state.year,w=state.week)=>y+'-'+w;
const isoWeeks=y=>{let d=new Date(Date.UTC(y,11,28));return isoWeek(d).week};
function isoWeek(date){let d=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));let y=d.getUTCFullYear();return {year:y,week:Math.ceil(((d-new Date(Date.UTC(y,0,1)))/86400000+1)/7)}}
function next(y,w){return w>=isoWeeks(y)?[y+1,1]:[y,w+1]}
function prev(y,w){return w===1?[y-1,isoWeeks(y-1)]:[y,w-1]}
function current(){return state.weeks[weekKey()]||{}}
function entry(id){return current()[id]||{seconds:0,done:false}}
function patch(id,data){let k=weekKey();state.weeks[k]??={};state.weeks[k][id]={...entry(id),...data};save()}
function seconds(id){let e=entry(id);return (e.seconds||0)+(active?.id===id?Math.max(0,Math.floor((Date.now()-active.start)/1000)):0)}
function fmt(sec){let m=Math.round(sec/60);return m>=60?Math.floor(m/60)+' u '+String(m%60).padStart(2,'0')+' min':m+' min'}
function timerFmt(s){return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function history(id){let [y,w]=[state.year,state.week],values=[];for(let i=0;i<520&&values.length<4;i++){[y,w]=prev(y,w);if(y<2026||(y===2026&&w<48))break;let v=state.weeks[weekKey(y,w)]?.[id]?.seconds||0;if(v>0)values.push(v)}return values}
function estimate(id){let h=history(id);return h.length?fmt(h.reduce((a,b)=>a+b,0)/h.length):'Nog geen gegevens'}
function completed(){return state.subjects.length>0&&state.subjects.every(s=>entry(s.id).done)}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));document.getElementById('weekPill').textContent='Week '+state.week+' · '+state.year;let root=document.getElementById('content');if(tab==='week'){
let done=state.subjects.filter(s=>entry(s.id).done).length,total=state.subjects.length,sec=state.subjects.reduce((n,s)=>n+seconds(s.id),0);
root.innerHTML=`<section class="summary"><div class="muted">Totaal deze week</div><strong>${fmt(sec)}</strong><div class="line"><span class="muted">${done} van ${total} onderdelen klaar</span><span class="muted">${total?Math.round(done/total*100):0}%</span></div><div class="progress"><div style="width:${total?done/total*100:0}%"></div></div></section>`+state.subjects.map(s=>{let e=entry(s.id),isActive=active?.id===s.id;return `<section class="subject"><div class="line"><div><h3>${esc(s.name)}</h3><div class="estimate">Geschatte duur: ${estimate(s.id)}</div></div><button class="ghost" data-remove="${esc(s.id)}" aria-label="${esc(s.name)} verwijderen">✕</button></div><div class="line" style="margin-top:14px"><div class="time" data-time="${esc(s.id)}">${isActive?timerFmt(seconds(s.id)):fmt(e.seconds||0)}</div><div class="actions"><button class="${isActive?'danger':'primary'}" data-timer="${esc(s.id)}" ${!isActive&&(!!active||e.done)?'disabled':''}>${isActive?'■ Stop':'▶ Start'}</button><button class="check ${e.done?'green':''}" data-done="${esc(s.id)}" aria-label="${esc(s.name)} afronden">✓</button></div></div>${isActive?'<div class="running">● Timer loopt. De tijd wordt opgeslagen bij Stop.</div>':''}</section>`}).join('')+`<button class="add" id="add">＋ Onderdeel toevoegen</button>`+(completed()?'<button class="primary add" id="next">🎉 Naar volgende week</button>':'');
}else{let ids=new Set(state.subjects.map(s=>s.id));let keys=Object.keys(state.weeks).filter(k=>{if(tab==='all')return true;let [y,w]=[state.year,state.week],valid=[];for(let i=0;i<4;i++){valid.push(weekKey(y,w));[y,w]=prev(y,w)}return valid.includes(k)});let totals=Object.fromEntries([...ids].map(id=>[id,keys.reduce((a,k)=>a+(state.weeks[k]?.[id]?.seconds||0),0)]));root.innerHTML=`<section class="summary"><div class="muted">${tab==='four'?'Afgelopen vier kalenderweken':'Alle geregistreerde weken'}</div><strong>${fmt(Object.values(totals).reduce((a,b)=>a+b,0))}</strong></section>`+state.subjects.map(s=>`<section class="stat"><div><b>${esc(s.name)}</b><div class="estimate">Schatting: ${estimate(s.id)}</div></div><b>${fmt(totals[s.id])}</b></section>`).join('')+(keys.length===0?'<div class="empty">Nog geen geregistreerde tijd.</div>':'');}
}
function show(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}
function hide(){dialog=null;document.getElementById('overlay').classList.add('hidden')}
function reward(kind,id){let e=id?entry(id):null,avg=id?history(id):[];let faster=!!(e&&e.seconds>0&&avg.length&&e.seconds<avg.reduce((a,b)=>a+b,0)/avg.length);let title=kind==='week'?'Hoera! Al je huiswerk is af!':faster?'Sneller afgerond dan gemiddeld!':e?.seconds===0?'Goed gedaan!':['Lekker bezig!','Goed gedaan!','Tijd om te relaxen!'][Math.floor(Math.random()*3)];let ix=kind==='week'?2:faster?1:title==='Lekker bezig!'?0:title==='Tijd om te relaxen!'?3:2;dialog={type:'reward',kind};show(`<img src="${ART[ix]}" alt="Vrolijke Japanse kawaii dierenillustratie"><h2>${title}</h2><p>${kind==='week'?'Je hebt alle onderdelen van week '+state.week+' afgerond.': 'Weer een onderdeel klaar!'} </p><div class="modalbuttons"><button class="primary" data-action="rewardContinue">${kind==='week'?'Naar volgende week':'Verder'}</button></div>`)}
function done(id){let e=entry(id);if(active?.id===id)stop();patch(id,{done:!e.done});render();if(!e.done){if(completed())reward('week');else reward('subject',id)}}
function stop(){if(!active)return;let id=active.id;patch(id,{seconds:(entry(id).seconds||0)+Math.max(0,Math.floor((Date.now()-active.start)/1000))});active=null;save()}
function advance(){if(active)stop();[state.year,state.week]=next(state.year,state.week);save();render()}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.timer){let id=b.dataset.timer;if(active?.id===id)stop();else if(!active)active={id,start:Date.now()};render();return}if(b.dataset.done){done(b.dataset.done);return}if(b.dataset.remove){let s=state.subjects.find(s=>s.id===b.dataset.remove);if(!s)return;dialog={type:'remove',id:s.id};show(`<h2>${esc(s.name)} verwijderen?</h2><p>Weet je zeker dat je dit onderdeel helemaal wilt verwijderen?</p><div class="modalbuttons"><button data-action="cancel">Nee, ${esc(s.name)} bewaren</button><button class="danger" data-action="remove">Ja, ${esc(s.name)} mag weg</button></div>`);return}if(b.id==='add'){dialog={type:'add'};show('<h2>Onderdeel toevoegen</h2><p>Hoe heet het nieuwe onderdeel?</p><input id="newSubject" maxlength="45" placeholder="Bijvoorbeeld Engels"><div class="modalbuttons"><button class="primary" data-action="add">Toevoegen</button><button data-action="cancel">Annuleren</button></div>');document.getElementById('newSubject').focus();return}if(b.id==='next'){reward('week');return}let action=b.dataset.action;if(!action)return;if(action==='cancel'){hide();return}if(action==='remove'&&dialog?.type==='remove'){let id=dialog.id;if(active?.id===id)stop();state.subjects=state.subjects.filter(s=>s.id!==id);save();hide();render();if(completed())reward('week');return}if(action==='add'&&dialog?.type==='add'){let name=document.getElementById('newSubject').value.trim();if(!name)return;if(state.subjects.some(s=>s.name.toLowerCase()===name.toLowerCase())){alert('Dit onderdeel bestaat al.');return}state.subjects.push({id:'s'+Date.now(),name});save();hide();render();return}if(action==='rewardContinue'){let kind=dialog?.kind;hide();if(kind==='week')advance();else render();return}});
window.addEventListener('beforeunload',()=>{if(active)stop()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){stop();render()}});setInterval(()=>{if(!active||tab!=='week')return;let el=document.querySelector('[data-time="'+active.id+'"]');if(el)el.textContent=timerFmt(seconds(active.id));let total=state.subjects.reduce((n,s)=>n+seconds(s.id),0);let strong=document.querySelector('.summary strong');if(strong)strong.textContent=fmt(total)},1000);render();
</script></body></html>
