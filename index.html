const BASE=['Rekenen','Taal','Spelling','Ontleden','Tekstbegrip','Schaken'];
const STORE='huiswerk_v48_2026_v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(STORE))}catch{return null}};
let state=load()||{subjects:BASE.map((name,i)=>({id:'s'+i,name})),weeks:{},year:2026,week:48};

const ACTIVE_STORE=STORE+'_active';
try{const saved=JSON.parse(localStorage.getItem(ACTIVE_STORE));if(saved&&saved.id&&Number.isFinite(saved.start)&&saved.start>0&&saved.start<=Date.now()&&saved.weekKey===state.year+'-'+state.week&&state.subjects.some(x=>x.id===saved.id)&&!state.weeks[saved.weekKey]?.[saved.id]?.done)active={id:saved.id,start:saved.start};else localStorage.removeItem(ACTIVE_STORE)}catch{localStorage.removeItem(ACTIVE_STORE)}

const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const weekKey=(y=state.year,w=state.week)=>y+'-'+w;
const isoWeeks=y=>{let d=new Date(Date.UTC(y,11,28));return isoWeek(d).week};
function isoWeek(date){let d=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));let y=d.getUTCFullYear();return {year:y,week:Math.ceil(((d-new Date(Date.UTC(y,0,1)))/86400000+1)/7)}}

function prev(y,w){return w===1?[y-1,isoWeeks(y-1)]:[y,w-1]}

function patch(id,data){let k=weekKey();state.weeks[k]??={};state.weeks[k][id]={...entry(id),...data};save()}
function seconds(id){let e=entry(id);return (e.seconds||0)+(active?.id===id?Math.max(0,Math.floor((Date.now()-active.start)/1000)):0)}
function fmt(sec){let m=Math.floor(sec/60);return m>=60?Math.floor(m/60)+' u '+String(m%60).padStart(2,'0')+' min':m+' min'}

 const series=subjectIds.map((id,i)=>{const subject=state.subjects.find(s=>s.id===id);return {id,name:subject?.name||state.subjectNames?.[id]||'Eerder onderdeel '+(i+1),color:palette[i%palette.length]}});
const data=weeks.map(wk=>series.map(s=>Math.floor((state.weeks[wk.key]?.[s.id]?.seconds||0)/60)));
const maxVal=Math.max(1,...data.flat());
const tickStep=Math.max(1,Math.ceil(maxVal/4));
const maxY=tickStep*4;
const plotW=640,plotH=260,left=48,right=12,top=18,bottom=56;
const innerW=plotW-left-right,innerH=plotH-top-bottom;
const groupW=innerW/Math.max(1,weeks.length), groupSpan=groupW*.77;
const barW=Math.min(26,groupSpan/Math.max(1,series.length)-2);
const bars=data.map((vals,i)=>vals.map((v,j)=>{const x=left+(i+.5)*groupW-(series.length*barW+(series.length-1)*2)/2+j*(barW+2);const h=v/maxY*innerH;const yy=top+innerH-h;return `<rect x="${x}" y="${yy}" width="${barW}" height="${h}" rx="3" fill="${series[j].color}"><title>${esc(series[j].name)} · week ${weeks[i].w} (${weeks[i].y}): ${v} minuten</title></rect>`}).join('')).join('');
const ticks=Array.from({length:5},(_,i)=>{const v=i*tickStep,yy=top+innerH-v/maxY*innerH;return `<line x1="${left}" y1="${yy}" x2="${plotW-right}" y2="${yy}" stroke="#dbe9df"/><text x="${left-9}" y="${yy+4}" text-anchor="end" font-size="12" fill="#58715d">${v}</text>`}).join('');
const labels=weeks.map((wk,i)=>`<text x="${left+(i+.5)*groupW}" y="${plotH-bottom+24}" text-anchor="middle" font-size="14" fill="#36523c">Week ${wk.w}</text>${i>0&&weeks[i-1].y!==wk.y?`<text x="${left+(i+.5)*groupW}" y="${plotH-bottom+42}" text-anchor="middle" font-size="11" fill="#647c69">${wk.y}</text>`:''}`).join('');
root.innerHTML=`<section class="summary"><h2>Laatste vier weken met geregistreerde tijd</h2><div class="muted">Huiswerktijd per vak, in minuten</div></section><section class="chart-panel"><div class="chart-scroll"><svg viewBox="0 0 ${plotW} ${plotH}" role="img" aria-label="Staafdiagram met minuten per vak over de afgelopen vier weken" style="display:block;width:100%;min-width:520px;height:auto"><text x="${left}" y="12" font-size="12" fill="#58715d">Minuten</text>${ticks}${bars}${labels}</svg></div><div class="chart-legend">${series.map(s=>`<span class="legend-item"><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>${weeks.length===0?'<p class="muted">Er zijn nog geen minuten geregistreerd.</p>':''}</section>`;

}}
function show(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}
function hide(){dialog=null;document.getElementById('overlay').classList.add('hidden')}
function reward(kind,id){
  const e=id?entry(id):null;
  const avg=id?history(id):[];
  const faster=!!(e&&e.seconds>0&&avg.length&&e.seconds<avg.reduce((a,b)=>a+b,0)/avg.length);
  const position=state.subjects.findIndex(s=>s.id===id);
  // 0-5: zes unieke gewone beloningen; 6-7: extra snelle beloningen; 8: weekbeloning.
  const ix=kind==='week'?8:faster?6+(Math.max(0,position)%2):Math.max(0,position)%6;
  const captions=['Goed gedaan!','Lekker bezig!','Klaar!','Slim aangepakt!','Mooi gedaan!','Tijd voor iets leuks!','Sneller dan gemiddeld!','Wauw! Dat ging snel!','Hoera! Al je huiswerk is af!'];
  const title=captions[ix];
  const detail=kind==='week'?'Je hebt alle onderdelen van week '+state.week+' afgerond.':faster?'Je was sneller klaar dan je gemiddelde tijd!':'Weer een onderdeel klaar!';
  dialog={type:'reward',kind};
  show(`<img src="${ART[ix]}" alt="Vrolijke kawaii-dieren" ><p>${detail}</p><div class="modalbuttons"><button class="primary" data-action="rewardContinue">${kind==='week'?'Naar volgende week':'Verder'}</button></div>`);
}
function done(id){let e=entry(id);if(active?.id===id)stop();patch(id,{done:!e.done});render();if(!e.done){if(completed())reward('week');else reward('subject',id)}}
function stop(){if(!active)return;let id=active.id;patch(id,{seconds:(entry(id).seconds||0)+Math.max(0,Math.floor((Date.now()-active.start)/1000))});active=null;saveActive();save()}
function advance(){if(active)stop();[state.year,state.week]=next(state.year,state.week);save();render()}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.timer){let id=b.dataset.timer;if(active?.id===id)stop();else if(!active){active={id,start:Date.now()};saveActive()}render();return}if(b.dataset.done){done(b.dataset.done);return}if(b.dataset.remove){let s=state.subjects.find(s=>s.id===b.dataset.remove);if(!s)return;dialog={type:'remove',id:s.id};show(`<h2>${esc(s.name)} verwijderen?</h2><p>Weet je zeker dat je dit onderdeel helemaal wilt verwijderen?</p><div class="modalbuttons"><button data-action="cancel">Nee, ${esc(s.name)} bewaren</button><button class="danger" data-action="remove">Ja, ${esc(s.name)} mag weg</button></div>`);return}if(b.id==='add'){if(state.subjects.length>=8){show('<h2>Maximaal 8 onderdelen</h2><p>Je kunt maximaal acht huiswerkonderdelen bijhouden. Verwijder eerst een onderdeel als je een ander wilt toevoegen.</p><div class="modalbuttons"><button class="primary" data-action="cancel">Begrepen</button></div>');return}dialog={type:'add'};show('<h2>Onderdeel toevoegen</h2><p>Hoe heet het nieuwe onderdeel?</p><input id="newSubject" maxlength="45" placeholder="Bijvoorbeeld Engels"><div class="modalbuttons"><button class="primary" data-action="add">Toevoegen</button><button data-action="cancel">Annuleren</button></div>');document.getElementById('newSubject').focus();return}if(b.id==='addTime'){
 if(active){show('<h2>Timer loopt nog</h2><p>Stop eerst de timer voordat je tijden aanpast.</p><div class="modalbuttons"><button class="primary" data-action="cancel">Begrepen</button></div>');return}
 dialog={type:'time'};
 const keys=[weekKey(),...Object.keys(state.weeks).filter(k=>k!==weekKey())].sort((a,b)=>{let [ay,aw]=a.split('-').map(Number),[by,bw]=b.split('-').map(Number);return by-ay||bw-aw});
 const options=keys.map(k=>{let [y,w]=k.split('-');return `<option value="${esc(k)}" ${k===weekKey()?'selected':''}>Week ${Number(w)} · ${Number(y)}</option>`}).join('');
 show(`<h2>Tijd toevoegen of vervangen</h2><p>Kies het vak en de week. Toevoegen telt minuten erbij op; vervangen stelt de totale tijd van dit vak in die week opnieuw in.</p><label for="timeSubject">Onderdeel</label><select id="timeSubject">${state.subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select><label for="timeWeek">Week</label><select id="timeWeek">${options}</select><label for="timeMode">Wat wil je doen?</label><select id="timeMode"><option value="add">Minuten toevoegen</option><option value="replace">Bestaande tijd vervangen</option></select><p id="timeExisting" class="muted"></p><label for="timeMinutes">Aantal minuten</label><input id="timeMinutes" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="Bijvoorbeeld 10"><div class="modalbuttons"><button class="primary" data-action="saveTime">Opslaan</button><button data-action="cancel">Annuleren</button></div>`);
 const update=()=>{let k=document.getElementById('timeWeek').value,id=document.getElementById('timeSubject').value;let sec=state.weeks[k]?.[id]?.seconds||0;document.getElementById('timeExisting').textContent='Al geregistreerd: '+fmt(sec)};
 ['timeWeek','timeSubject','timeMode'].forEach(id=>document.getElementById(id).addEventListener('change',update));update();return
 }if(b.id==='resetProgress'){dialog={type:'reset'};show('<h2>Alle voortgang wissen?</h2><p>Weet je zeker dat je alle geregistreerde huiswerktijden, vinkjes en weekgeschiedenis wilt wissen? Dit kan niet ongedaan worden gemaakt. Je onderdelen blijven bestaan en de app begint opnieuw bij week 48 van 2026.</p><div class="modalbuttons"><button data-action="cancel">Nee, voortgang bewaren</button><button class="danger" data-action="resetConfirm">Ja, alle voortgang wissen</button></div>');return}if(b.id==='next'){reward('week');return}let action=b.dataset.action;if(!action)return;if(action==='cancel'){hide();return}if(action==='saveTime'&&dialog?.type==='time'){
 const id=document.getElementById('timeSubject').value,k=document.getElementById('timeWeek').value,mode=document.getElementById('timeMode').value;
 const input=document.getElementById('timeMinutes');const minutes=Number(input.value);
 if(!state.subjects.some(s=>s.id===id)||!/^\d{4}-\d{1,2}$/.test(k)||!input.value.trim()||!Number.isSafeInteger(minutes)||minutes<0||minutes>100000){alert('Vul een geldig aantal hele minuten in.');return}
 if(!['add','replace'].includes(mode)){return}
 state.weeks[k]??={};const old=state.weeks[k][id]||{seconds:0,done:false};
 state.weeks[k][id]={...old,seconds:mode==='add'?(old.seconds||0)+minutes*60:minutes*60};
 save();hide();render();return
 }if(action==='resetConfirm'&&dialog?.type==='reset'){active=null;saveActive();state.weeks={};state.year=2026;state.week=48;tab='week';save();hide();render();return}if(action==='remove'&&dialog?.type==='remove'){let id=dialog.id;if(active?.id===id)stop();state.subjectNames??={};let removed=state.subjects.find(s=>s.id===id);if(removed)state.subjectNames[id]=removed.name;state.subjects=state.subjects.filter(s=>s.id!==id);save();hide();render();return}if(action==='add'&&dialog?.type==='add'){if(state.subjects.length>=8){alert('Je kunt maximaal 8 onderdelen bijhouden. Verwijder eerst een onderdeel.');return}let name=document.getElementById('newSubject').value.trim();if(!name)return;if(state.subjects.some(s=>s.name.toLowerCase()===name.toLowerCase())){alert('Dit onderdeel bestaat al.');return}state.subjects.push({id:'s'+Date.now(),name});save();hide();render();return}if(action==='rewardContinue'){let kind=dialog?.kind;hide();if(kind==='week')advance();else render();return}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});window.addEventListener('pageshow',()=>render());setInterval(()=>{if(!active||tab!=='week')return;let el=document.querySelector('[data-time="'+active.id+'"]');if(el)el.textContent=timerFmt(seconds(active.id));let total=state.subjects.reduce((n,s)=>n+seconds(s.id),0);let strong=document.querySelector('.summary strong');if(strong)strong.textContent=fmt(total)},1000);render();
